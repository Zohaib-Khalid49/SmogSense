<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- SmogSense mark: a cloud with wind swirls (air + movement).
       Line-art style, brand slate. Wind lines carry the hazard palette
       (green / amber / red) to tie back to the air-quality theme. -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Cloud outline -->
    <path
      d="M18 30
         a10 10 0 0 1 9.6 -12.8
         a12 12 0 0 1 22.4 4.2
         a8.5 8.5 0 0 1 -1.4 16.9
         H23
         a8 8 0 0 1 -5 -8.3 Z"
      stroke="#1e293b" stroke-width="3.4"/>

    <!-- Wind swirls beneath the cloud -->
    <!-- top gust (safe/green) -->
    <path d="M14 40 H41 a4.2 4.2 0 1 0 -4.2 -4.2"
          stroke="#16a34a" stroke-width="3.4"/>
    <!-- middle gust (caution/amber) -->
    <path d="M12 48 H45 a4.6 4.6 0 1 1 -4.6 4.6"
          stroke="#f59e0b" stroke-width="3.4"/>
    <!-- bottom gust (hazard/red) -->
    <path d="M16 56 H35 a4 4 0 1 0 -4 -4"
          stroke="#dc2626" stroke-width="3.4"/>
  </g>
</svg>
